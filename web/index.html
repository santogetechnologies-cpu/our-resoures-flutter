<!DOCTYPE html>
<html lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ثرواتنا من أرضنا - تطبيق الخرائط التفاعلية الجيولوجية والمعدنية والمائية والنفطية والزلزالية والسياحية للمملكة العربية السعودية">

  <!-- iOS and modern mobile meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ثرواتنا من أرضنا">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ثرواتنا من أرضنا</title>
  <link rel="manifest" href="manifest.json">

  <!-- MapLibre GL JS v5 with 3D Globe Projection (Token-free, 100% stable) -->
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

  <!-- RTL Text Plugin for Arabic & BiDi support on MapLibre maps -->
  <script>
    if (window.maplibregl && maplibregl.setRTLTextPlugin) {
      try {
        if (maplibregl.getRTLTextPluginStatus() === 'unavailable') {
          maplibregl.setRTLTextPlugin(
            'https://unpkg.com/@mapbox/mapbox-gl-rtl-text@0.2.3/mapbox-gl-rtl-text.min.js',
            function (err) {
              if (err) console.error('[MapLibre RTL Text Plugin Error]:', err);
            },
            true
          );
        }
      } catch (e) {
        console.warn('[MapLibre RTL Text Plugin Init]:', e);
      }
    }
  </script>

  <!-- 3D Globe Web Bridge -->
  <script src="mapbox_globe.js?v=arabic_final_3"></script>

  <!-- PDF.js for Syncfusion PDF Viewer (Official compatible version 2.11.338) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js" type="text/javascript"></script>
  <script type="text/javascript">
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js";
    }
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      /* Loading screen background — matches wallpaper2.jpg used in StartScreen */
      background: url('assets/assets/images/wallpaper2.jpg') center center / cover no-repeat;
      background-color: #F7F4EF; /* fallback if image hasn't loaded yet */
      overflow: hidden;
    }
    .maplibregl-canvas, .mapboxgl-canvas {
      outline: none;
    }
    .mapbox-custom-marker {
      pointer-events: auto;
    }
  </style>


  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;
  </script>
  <!-- This script adds the flutter initialization JS code -->
  <script src="flutter.js" defer></script>
</head>
<body style="margin: 0; overflow: hidden; background: url('assets/assets/images/wallpaper2.jpg') center center / cover no-repeat; background-color: #F7F4EF;">

  <script>
    window.addEventListener('load', function(ev) {
      // Download main.dart.js
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
