<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Test Geospatial Doc Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js";
    }
  </script>
  <script src="xlsx.full.min.js"></script>
  <script src="geospatial_doc_viewer.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
    #container { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="container"></div>
  <script>
    window.addEventListener('load', function() {
      console.log('Testing initGeospatialDocViewer...');
      try {
        window.initGeospatialDocViewer(
          'container',
          document.getElementById('container'),
          'assets/books/general_books/geospatial_portal.pdf',
          'assets/data/geospatial_am_my3.xlsx'
        );
        console.log('initGeospatialDocViewer called successfully');
      } catch (e) {
        console.error('Error calling initGeospatialDocViewer:', e);
      }
    });
  </script>
</body>
</html>
