name: flutter_app
description: "Our Resources - A comprehensive interactive geological, mineral, water, oil, gas, earthquake and tourism map of Saudi Arabia."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  latlong2: ^0.9.0
  flutter_map: ^6.0.0
  mapbox_maps_flutter: ^2.3.0
  excel: ^4.0.0
  syncfusion_flutter_pdfviewer: any

dependency_overrides:
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/tourism/
    - assets/data/
    - assets/earthquake/
    - assets/maps/
    - assets/maps/saudi_geo/
    - assets/maps/valleys/
    - assets/maps/water_formation/
    - assets/maps/materials/
    - assets/maps/earthquake/
    - assets/books/educational/
    - assets/books/specialized/
    - assets/books/general_books/
    - assets/books/zamzam/

  fonts:
    - family: NotoKufi
      fonts:
        - asset: assets/fonts/notokufi_regular.ttf
          weight: 400
        - asset: assets/fonts/notokufi_semibold.ttf
          weight: 600
        - asset: assets/fonts/notokufi_bold.ttf
          weight: 700
        - asset: assets/fonts/notokufi_extrabold.ttf
          weight: 800
    - family: ReemKufi
      fonts:
        - asset: assets/fonts/reem_kufi.ttf
          weight: 400
