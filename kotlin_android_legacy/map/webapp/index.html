<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الخرائط التفاعلية الجيولوجية والجيوفيزيائية للمملكة العربية السعودية</title>

  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Mapbox GL JS -->
  <script src='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js'></script>
  <link href='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css' rel='stylesheet' />

  <!-- App Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app-container">

    <!-- Sidebar Menu -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="logo-area">
          <img src="assets/imgs/icon_project.png" alt="الجمعية السعودية لعلوم الأرض" class="logo-icon" onerror="this.src='assets/imgs/d_logo.png'">
          <div class="title-area">
            <h1>أطلس الخرائط التفاعلية</h1>
            <p>الجمعية السعودية لعلوم الأرض</p>
          </div>
        </div>
      </div>

      <div class="nav-menu">

        <!-- 1. General Geology -->
        <div class="menu-category active">
          <button class="category-header">
            <span class="cat-icon"><i class="fas fa-layer-group"></i> جيولوجية المملكة</span>
            <i class="fas fa-chevron-down"></i>
          </button>
          <div class="category-content">
            <button class="sub-btn" data-geo-layer="saudigeo">الخارطة الجيولوجية العامة</button>
            <button class="sub-btn" data-geo-layer="arabian_shield">الدرع العربي</button>
            <button class="sub-btn" data-geo-layer="arabian_platform">الرصيف القاري العربي</button>
            <button class="sub-btn" data-geo-layer="harat">الحرات البركانية</button>
            <button class="sub-btn" data-geo-layer="sahel">السهول الساحلية</button>
          </div>
        </div>

        <!-- 2. Water Formations & Dams -->
        <div class="menu-category">
          <button class="category-header">
            <span class="cat-icon"><i class="fas fa-droplet"></i> التكاوين المائية والسدود</span>
            <i class="fas fa-chevron-down"></i>
          </button>
          <div class="category-content">
            <button class="sub-btn" data-water-layer="allformations">كافة التكاوين المائية</button>
            <button class="sub-btn" data-water-layer="saq">تكوين الساق</button>
            <button class="sub-btn" data-water-layer="tabuk">تكوين تبوك</button>
            <button class="sub-btn" data-water-layer="minjur">تكوين المنجور</button>
            <button class="sub-btn" data-water-layer="radmaa">تكوين أم الرضمة</button>
            <button class="sub-btn" id="btn-dams">سدود المملكة العربية السعودية</button>
          </div>
        </div>

        <!-- 3. Oil & Gas -->
        <div class="menu-category">
          <button class="category-header">
            <span class="cat-icon"><i class="fas fa-oil-well"></i> حقول البترول والغاز</span>
            <i class="fas fa-chevron-down"></i>
          </button>
          <div class="category-content">
            <button class="sub-btn" id="btn-oil">استعراض حقول النفط والغاز</button>
          </div>
        </div>

        <!-- 4. Economic Minerals -->
        <div class="menu-category">
          <button class="category-header">
            <span class="cat-icon"><i class="fas fa-gem"></i> المعادن الاقتصادية</span>
            <i class="fas fa-chevron-down"></i>
          </button>
          <div class="category-content">
            <label style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 4px;">اختر نوع المعدن الخام:</label>
            <select id="mineral-select" style="width: 100%; padding: 10px; border-radius: 8px; background: var(--bg-card); color: var(--text-main); border: 1px solid var(--accent-gold); font-family: inherit; font-size: 0.9rem; cursor: pointer;">
              <option value="">-- اختر المعدن --</option>
              <option value="Gold">الذهب (Gold)</option>
              <option value="Copper">النحاس (Copper)</option>
              <option value="Iron">الحديد (Iron)</option>
              <option value="Phosphate">الفوسفات (Phosphate)</option>
              <option value="Bauxite">البوكسيت (Bauxite)</option>
              <option value="Silver">الفضة (Silver)</option>
              <option value="Zinc">الزنك (Zinc)</option>
              <option value="Granite">الجرانيت (Granite)</option>
              <option value="Marble">الرخام (Marble)</option>
              <option value="Gypsum">الجبس (Gypsum)</option>
              <option value="Limestone">الحجر الجيري (Limestone)</option>
              <option value="Uranium">اليومانيوم (Uranium)</option>
              <option value="SilicaSand">رمل السيليكا (Silica Sand)</option>
              <option value="Salt">الملح الصخري (Salt)</option>
              <option value="Clay">الطين والصلصال (Clay)</option>
            </select>
          </div>
        </div>

        <!-- 5. Seismic Database -->
        <div class="menu-category">
          <button class="category-header">
            <span class="cat-icon"><i class="fas fa-house-crack"></i> قاعدة البيانات الزلزالية</span>
            <i class="fas fa-chevron-down"></i>
          </button>
          <div class="category-content">
            <button class="sub-btn" data-eq-range="q4to5">الهزات بمقدار (4 - 5)</button>
            <button class="sub-btn" data-eq-range="q5to6">الهزات بمقدار (5 - 6)</button>
            <button class="sub-btn" data-eq-range="q6to7">الهزات بمقدار (6 - 7)</button>
            <button class="sub-btn" data-eq-range="q7plus">الهزات بمقدار (7 وأعلى)</button>
            <button class="sub-btn" data-eq-range="historical">الزلازل التاريخية</button>
          </div>
        </div>

        <!-- 6. Geotourism -->
        <div class="menu-category">
          <button class="category-header">
            <span class="cat-icon"><i class="fas fa-mountain-sun"></i> السياحة والآثار الجيولوجية</span>
            <i class="fas fa-chevron-down"></i>
          </button>
          <div class="category-content">
            <button class="sub-btn" id="btn-tourism">استعراض كافة المعالم الجيولوجية والأثرية</button>
          </div>
        </div>

        <!-- 7. Supervisor & Project Info -->
        <div class="menu-category">
          <button class="category-header">
            <span class="cat-icon"><i class="fas fa-user-tie"></i> كلمة رئيس الجمعية المشرف</span>
            <i class="fas fa-chevron-down"></i>
          </button>
          <div class="category-content">
            <button class="sub-btn" id="btn-intro">نبذة عن المشروع وفريق العمل</button>
          </div>
        </div>

        <!-- 8. References -->
        <div class="menu-category">
          <button class="category-header">
            <span class="cat-icon"><i class="fas fa-book-bookmark"></i> المصادر والمراجع</span>
            <i class="fas fa-chevron-down"></i>
          </button>
          <div class="category-content">
            <button class="sub-btn" id="btn-sources">عرض قائمة المراجع العلمية</button>
          </div>
        </div>

      </div>
    </aside>

    <!-- Sidebar Toggle Button -->
    <button id="toggle-sidebar-btn" title="تبديل القائمة">
      <i class="fas fa-chevron-right"></i>
    </button>

    <!-- Map Canvas Area -->
    <main id="map"></main>

    <!-- Floating Map Controls -->
    <div class="map-controls">
      <button class="control-btn" id="reset-zoom-btn" title="إعادة ضبط عرض الخارطة">
        <i class="fas fa-compress"></i>
      </button>
    </div>

    <!-- Spinner Loading Overlay -->
    <div id="loading-spinner">
      <div class="spinner"></div>
      <span>جاري تحميل البيانات الخارطية...</span>
    </div>

    <!-- Popup / Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal-box">
        <div class="modal-header">
          <h2 id="modal-title">العنوان</h2>
          <button class="modal-close-btn" id="modal-close-btn">&times;</button>
        </div>
        <div class="modal-body" id="modal-body">
          <!-- Dynamic Content -->
        </div>
      </div>
    </div>

  </div>

  <!-- Data & Logic JS -->
  <script src="js/data.js"></script>
  <script src="js/extracted_data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
